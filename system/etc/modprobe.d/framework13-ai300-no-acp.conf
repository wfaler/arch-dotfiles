# Framework 13 Ryzen AI 300: hide the phantom AMD ACP digital mic.
#
# The firmware advertises an ACP PDM mic (card "acp-pdm-mach") that is not
# wired to anything: it opens fine but captures a constant full-scale value.
# PipeWire/UCM then offers it as "Digital Microphone" and may pick it over the
# real internal mic, which is on the Realtek ALC285 ("Internal Mic").
# Without these modules only the ALC285 path is left.
#
# Upstream: FrameworkComputer/SoftwareFirmwareIssueTracker#166. Same fix as
# nixos-hardware and omarchy. Remove once a BIOS update fixes the ACPI tables.
blacklist snd_acp70
blacklist snd_acp_pci
