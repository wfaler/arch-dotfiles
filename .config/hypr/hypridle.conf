general {
    # Every lock goes through here (loginctl lock-session): start hyprlock only if this
    # session is not locked yet. A second hyprlock can hang (hyprwm/hyprlock#1075) and
    # then hides a later crash from lock-watchdog.sh; the old `pidof hyprlock` check
    # also saw other sessions' hyprlock and could skip the lock before sleep.
    lock_cmd = [ "$(hyprctl locked)" = true ] || /usr/bin/hyprlock
    before_sleep_cmd = loginctl lock-session
    # A hyprlock that crashes on resume (or any time while locked) is relaunched by
    # scripts/lock-watchdog.sh, started from hyprland.lua.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Dim backlight to 30% after 60s idle, on battery only. brightnessctl -s saves
# the current value so -r restores exactly what the user had set.
# No-op on desktops (no AC adapter at /sys/class/power_supply/A*).
listener {
    timeout = 60
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/A*/online 2>/dev/null | head -n1)" = "0" ] && brightnessctl -s set 30%'
    on-resume = sh -c 'brightnessctl -r 2>/dev/null || true'
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'
}

# Suspend after 10 minutes, but only when on battery AND not docked.
# On a desktop (no battery) AC is always online, so this never fires.
# "Docked" is logind's own judgement (an external display is connected), the same one
# that makes it ignore the lid: a laptop driving an external screen never idle-suspends,
# even if the monitor's USB-C power drops out.
# Hibernate could replace `systemctl suspend` here once a resume target is configured.
listener {
    timeout = 600
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/A*/online 2>/dev/null | head -n1)" = "0" ] && [ "$(busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager Docked 2>/dev/null)" != "b true" ] && systemctl suspend'
}
