# Shokz OpenMeet: headset (HFP) only, never A2DP.
#
# It is only ever used as mic + headphones. Left to the default, WirePlumber starts
# it in A2DP and autoswitches to HFP when a call opens the mic. On the MT7925
# Bluetooth chip in the Framework 13 that A2DP <-> HFP switch regularly fails
# ("Failure in Bluetooth audio transport", "corrupted SCO packet"), leaving the mic
# working but the output dead. Not connecting A2DP at all means there is nothing to
# switch.
#
# Swap device.profile to "headset-head-unit-cvsd" if mSBC proves unreliable.
monitor.bluez.rules = [
  {
    matches = [
      { device.name = "bluez_card.A8_F5_E1_F2_DD_D6" }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ hfp_hf hsp_hs ]
        device.profile = "headset-head-unit"
      }
    }
  }
]
