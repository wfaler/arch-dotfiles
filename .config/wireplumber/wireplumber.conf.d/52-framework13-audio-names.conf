# Framework 13 (Ryzen AI 300): readable names for the two built-in audio devices.
#
# Both ALSA cards call themselves "HD-Audio Generic", and wiremix labels every
# output/input with device.nick -- so the switcher showed two identical entries.
# device.nick feeds wiremix; device/node.description feed pavucontrol and the
# Waybar tooltip ({desc}). Matched by PCI address, so on any other machine these
# rules simply match nothing.
#
# The monitor output cannot be named after a specific monitor: the GPU connector
# (and so the node) a monitor lands on changes between plugs, and the node's own
# alsa.name only sometimes carries the monitor name. audio-follow-display.sh picks
# which monitor the card plays to.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_c1_00.6" } ]
    actions = {
      update-props = {
        device.nick        = "Laptop"
        device.description = "Laptop audio"
      }
    }
  }
  {
    matches = [ { device.name = "alsa_card.pci-0000_c1_00.1" } ]
    actions = {
      update-props = {
        device.nick        = "Monitor (HDMI/DP)"
        device.description = "Monitor audio (HDMI/DP)"
      }
    }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_c1_00.6.analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "Laptop speakers"
        node.description = "Laptop speakers / headphones"
      }
    }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.analog-stereo" } ]
    actions = {
      update-props = {
        node.nick        = "Laptop mic"
        node.description = "Laptop microphone"
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_output.pci-0000_c1_00.1.*" } ]
    actions = {
      update-props = {
        node.nick        = "Monitor speakers"
        node.description = "Monitor speakers (HDMI/DP)"
      }
    }
  }
]
